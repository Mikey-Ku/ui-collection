<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ui-collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/core.css?v=96af677d">
<link rel="stylesheet" href="../tokens/theme-mk.css?v=96af677d">
<link rel="stylesheet" href="../css/base.css?v=96af677d">
<link rel="stylesheet" href="../css/components.css?v=96af677d">
<style>
  /* Board chrome. Hairlines and whitespace only — the site's own habit. */
  .bd-top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: var(--mk-6);
    height: 68px; padding-inline: clamp(1.25rem, 5vw, 2.5rem);
    background: var(--paper);
    border-bottom: 1px solid var(--mk-line);
  }
  .bd-mark {
    font-family: var(--mk-font-display); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.18em;
    font-size: var(--mk-text-xs); white-space: nowrap;
  }
  .bd-mark b { color: var(--mk-accent); font-weight: 500; }
  .bd-search { flex: 1; max-width: 320px; }

  /* Accent swatches. The site ships one accent and documents the swaps;
     this makes the swap something you can see rather than imagine. */
  .bd-accents { display: flex; gap: 6px; }
  .bd-swatch {
    width: 18px; height: 18px; padding: 0;
    border: 1px solid var(--mk-line-strong); border-radius: 50%;
    cursor: pointer;
    transition: transform var(--mk-dur-fast) var(--mk-ease), box-shadow var(--mk-dur-fast) var(--mk-ease);
  }
  .bd-swatch:hover { transform: translateY(-2px); }
  .bd-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--ink); }

  .bd-wrap { max-width: var(--mk-container); margin-inline: auto; padding: var(--mk-12) clamp(1.25rem, 5vw, 2.5rem) var(--mk-16); }
  .bd-head { margin-bottom: var(--mk-8); }
  .bd-head h1 { font-size: var(--mk-text-2xl); margin: var(--mk-3) 0 var(--mk-2); }
  .bd-head p { color: var(--mk-text-muted); max-width: 52ch; }

  .bd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--mk-5); }

  .bd-tile {
    display: flex; flex-direction: column;
    border: 1px solid var(--mk-line); border-radius: var(--mk-radius-lg);
    background: var(--paper); overflow: hidden;
    transition: transform var(--mk-dur) var(--mk-ease),
                border-color var(--mk-dur) var(--mk-ease),
                box-shadow var(--mk-dur) var(--mk-ease);
  }
  .bd-tile:hover { transform: translateY(-4px); border-color: var(--mk-line-strong); box-shadow: var(--mk-shadow-2); }

  .bd-tile__view {
    display: grid; place-items: center;
    min-height: 200px; padding: var(--mk-10) var(--mk-5);
    background: var(--paper-sunk);
    border-bottom: 1px solid var(--mk-line);
  }

  .bd-tile__bar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--mk-3);
    width: 100%; padding: var(--mk-4);
    border: 0; background: transparent; color: var(--mk-text);
    font-family: var(--mk-font-display);
    font-size: var(--mk-text-sm); font-weight: 500; letter-spacing: -0.015em;
    cursor: pointer; text-align: left;
    transition: color var(--mk-dur-fast) var(--mk-ease);
  }
  .bd-tile__bar:hover { color: var(--mk-accent); }
  .bd-tile__kind {
    display: flex; align-items: center; gap: var(--mk-2);
    font-size: var(--mk-text-xs); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--mk-text-faint);
  }
  .bd-tile__kind i { font-style: normal; transition: transform var(--mk-dur-fast) var(--mk-ease); }
  .bd-tile[data-open] .bd-tile__kind i { transform: rotate(90deg); }

  /* grid-template-rows animates to natural height without measuring. */
  .bd-tile__detail {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--mk-dur) var(--mk-ease);
  }
  .bd-tile[data-open] .bd-tile__detail { grid-template-rows: 1fr; }
  .bd-tile__detail > div { overflow: hidden; }
  .bd-tile__detail p {
    padding: 0 var(--mk-4) var(--mk-3);
    color: var(--mk-text-muted); font-size: var(--mk-text-sm);
  }
  .bd-classes { display: flex; flex-wrap: wrap; gap: var(--mk-1); padding: 0 var(--mk-4) var(--mk-4); }
  .bd-class {
    padding: 2px 7px; border-radius: var(--mk-radius-sm);
    background: var(--paper-sunk); border: 1px solid var(--mk-line);
    font-family: var(--mk-font-mono); font-size: 10px; color: var(--mk-text-muted);
  }

  .bd-empty { padding: var(--mk-16) 0; text-align: center; }

  @media (max-width: 720px) {
    .bd-grid { grid-template-columns: minmax(0, 1fr); }
    .bd-top { height: auto; padding-block: var(--mk-3); flex-wrap: wrap; }
    .bd-search { max-width: none; order: 4; width: 100%; }
  }
</style>
</head>
<body>

<header class="bd-top">
  <span class="bd-mark">mk<b>/</b>collection</span>
  <div class="bd-search">
    <input class="mk-input" id="q" type="search" placeholder="Search…   /" aria-label="Search the collection" autocomplete="off">
  </div>
  <span class="mk-grow"></span>
  <div class="bd-accents" role="group" aria-label="Accent">
    <button class="bd-swatch" data-accent-pick="" style="background:#0f7d54" aria-pressed="true" aria-label="Emerald"></button>
    <button class="bd-swatch" data-accent-pick="cobalt" style="background:#2f5fe0" aria-pressed="false" aria-label="Cobalt"></button>
    <button class="bd-swatch" data-accent-pick="indigo" style="background:#5b4bd6" aria-pressed="false" aria-label="Indigo"></button>
    <button class="bd-swatch" data-accent-pick="slate" style="background:#3f5366" aria-pressed="false" aria-label="Slate"></button>
  </div>
  <span class="mk-eyebrow" id="count">—</span>
</header>

<div class="bd-wrap">
  <div class="bd-head">
    <span class="mk-eyebrow">Collection</span>
    <h1>Components &amp; motion</h1>
    <p>Small pieces, live and interactive, built on the same base as the site. Click a name for the note and the classes it uses.</p>
  </div>

  <div class="bd-grid" id="grid"></div>
  <div class="bd-empty" id="empty" hidden>
    <p class="mk-muted">Nothing here matches that yet. Worth building?</p>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
// no-store: the registry is hand-edited constantly, and a cached copy
// silently renders yesterday's board.
const reg = await (await fetch("../registry/registry.json", { cache: "no-store" })).json();
const items = reg.items ?? [];

/* ---------------------------------------------------------------
   Behaviours. Every demo takes a root and wires only what is inside
   it, so a specimen can be mounted more than once without shared
   state or ids.
   --------------------------------------------------------------- */
const behaviors = {
  seg(root) {
    const ind = root.querySelector(".mk-seg__ind");
    const opts = [...root.querySelectorAll(".mk-seg__opt")];
    const move = (el) => {
      if (!el || !el.offsetWidth) return; // detached or not laid out yet
      ind.style.setProperty("--w", `${el.offsetWidth}px`);
      ind.style.setProperty("--x", `${el.offsetLeft - 3}px`);
    };
    opts.forEach((o) => o.addEventListener("click", () => {
      opts.forEach((x) => x.setAttribute("aria-selected", String(x === o)));
      move(o);
    }));
    // Widths shift when fonts land or the container resizes.
    const sync = () => move(root.querySelector('[aria-selected="true"]'));
    new ResizeObserver(sync).observe(root);
    sync();
  },

  copy(btn) {
    btn.addEventListener("click", () => {
      navigator.clipboard?.writeText("--accent").catch(() => {});
      btn.dataset.copied = "";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => delete btn.dataset.copied, 1600);
    });
  },

  toast(btn) {
    const slot = btn.closest("[data-demo]").querySelector("[data-toast-slot]");
    btn.addEventListener("click", () => {
      slot.replaceChildren();
      const t = document.createElement("div");
      t.className = "mk-toast";
      t.innerHTML = `<span class="mk-dot" style="color: var(--mk-accent)"></span> Added to the collection`;
      slot.append(t);
      setTimeout(() => {
        t.dataset.leaving = "";
        t.addEventListener("animationend", () => t.remove(), { once: true });
      }, 2200);
    });
  },

  meter(btn) {
    const fill = btn.closest("[data-demo]").querySelector("[data-meter]");
    const run = () => {
      fill.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = "72%"; }));
    };
    btn.addEventListener("click", run);
    run();
  },
};

function mount(root) {
  for (const el of root.querySelectorAll("[data-behavior]")) behaviors[el.dataset.behavior]?.(el);
}

/* --------------------------------------------------------------- */

function tile(it) {
  const el = document.createElement("article");
  el.className = "bd-tile";
  el.dataset.id = it.id;
  el.innerHTML = `
    <div class="bd-tile__view" data-demo>${it.demo ?? ""}</div>
    <button class="bd-tile__bar" aria-expanded="false">
      <span>${it.name ?? it.id}</span>
      <span class="bd-tile__kind">${it.kind ?? ""} <i>&rsaquo;</i></span>
    </button>
    <div class="bd-tile__detail"><div>
      <p>${it.note ?? ""}</p>
      <div class="bd-classes">${(it.css ?? []).map((c) => `<span class="bd-class">.${c}</span>`).join("")}</div>
    </div></div>`;

  const bar = el.querySelector(".bd-tile__bar");
  bar.addEventListener("click", () => {
    const open = "open" in el.dataset;
    if (open) delete el.dataset.open; else el.dataset.open = "";
    bar.setAttribute("aria-expanded", String(!open));
  });
  return el;
}

/* Keyword search over each item's own fields, widened by aliases and a
   small synonym map. Not embeddings — see the README. */
const SYNONYMS = {
  click: ["button", "press", "action"],
  loading: ["spinner", "skeleton", "shimmer", "wait"],
  animation: ["motion", "slide", "draw", "swap", "grow", "scale"],
  motion: ["slide", "draw", "swap", "grow", "travel", "scale"],
  form: ["checkbox", "switch", "toggle", "input", "selection"],
  transition: ["slide", "crossfade", "swap", "grow", "enter", "exit"],
};

// Every field optional on purpose: a half-finished entry should still
// show up rather than take the page down with it.
const hay = new Map(items.map((it) => [it.id, [
  it.id, it.name, it.kind, it.note,
  ...(it.tags ?? []), ...(it.aliases ?? []), ...(it.css ?? []),
].filter(Boolean).join(" ").toLowerCase()]));

function render() {
  const raw = $("#q").value.trim().toLowerCase();
  const terms = raw ? [raw, ...(SYNONYMS[raw] ?? [])] : [];
  const shown = items.filter((it) => !terms.length || terms.some((t) => hay.get(it.id).includes(t)));

  // Attach first, then mount — behaviours measure layout, and a detached
  // element measures as zero.
  $("#grid").replaceChildren(...shown.map(tile));
  mount($("#grid"));

  $("#empty").hidden = shown.length > 0;
  $("#count").textContent = raw ? `${shown.length} / ${items.length}` : `${items.length} pieces`;
}

$("#q").addEventListener("input", render);

document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-accent-pick]");
  if (!s) return;
  const v = s.dataset.accentPick;
  if (v) document.documentElement.dataset.accent = v;
  else delete document.documentElement.dataset.accent;
  document.querySelectorAll("[data-accent-pick]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b === s)));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); }
});

render();
</script>
</body>
</html>
