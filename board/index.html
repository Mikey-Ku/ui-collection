<!doctype html>
<html lang="en" data-theme="board">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mk-ui — board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/core.css?v=176afa90">
<link rel="stylesheet" href="../tokens/theme-board.css?v=176afa90">
<link rel="stylesheet" href="../css/base.css?v=176afa90">
<link rel="stylesheet" href="../css/components.css?v=176afa90">
<style>
  /* Board chrome. Matte throughout — no shadow, no blur, hairlines only. */
  .bd-top {
    display: flex; align-items: center; gap: var(--mk-5);
    height: 54px; padding-inline: var(--mk-6);
    border-bottom: 1px solid var(--mk-line);
    position: sticky; top: 0; z-index: 5;
    background: var(--mk-bg);
  }
  .bd-mark {
    font-family: var(--mk-font-display); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.18em; font-size: var(--mk-text-sm);
    white-space: nowrap;
  }
  .bd-mark b { color: var(--mk-accent); font-weight: 700; }
  .bd-search { flex: 1; max-width: 360px; }
  .bd-search .mk-input { background: var(--mk-surface-sunk); }

  .bd-wrap { max-width: 1000px; margin-inline: auto; padding: var(--mk-8) var(--mk-6) var(--mk-16); }

  .bd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--mk-5); }

  .bd-tile {
    display: flex; flex-direction: column;
    border: 1px solid var(--mk-line); border-radius: var(--mk-radius-lg);
    background: var(--mk-surface); overflow: hidden;
    transition: border-color var(--mk-dur) var(--mk-ease);
  }
  .bd-tile:hover { border-color: var(--mk-line-strong); }
  .bd-tile[data-open] { border-color: var(--mk-accent); }

  /* The specimen sits on graph paper so its real edges are readable
     against the board. */
  .bd-tile__view {
    display: grid; place-items: center;
    min-height: 190px; padding: var(--mk-8) var(--mk-5);
    background:
      linear-gradient(var(--mk-line) 1px, transparent 1px) 0 0 / 100% 24px,
      linear-gradient(90deg, var(--mk-line) 1px, transparent 1px) 0 0 / 24px 100%;
    background-color: var(--mk-surface-sunk);
  }

  .bd-tile__bar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--mk-3);
    width: 100%; padding: var(--mk-3) var(--mk-4);
    border: 0; border-top: 1px solid var(--mk-line);
    background: transparent; color: var(--mk-text);
    font-family: var(--mk-font-display);
    text-transform: uppercase; letter-spacing: 0.14em;
    font-size: var(--mk-text-xs); font-weight: 600;
    cursor: pointer; text-align: left;
    transition: background-color var(--mk-dur) var(--mk-ease), color var(--mk-dur) var(--mk-ease);
  }
  .bd-tile__bar:hover { background: var(--mk-surface-2); color: var(--mk-accent); }
  .bd-tile__kind { display: flex; align-items: center; gap: var(--mk-2); color: var(--mk-text-faint); }
  .bd-tile__kind i { font-style: normal; transition: transform var(--mk-dur) var(--mk-ease); }
  .bd-tile[data-open] .bd-tile__kind i { transform: rotate(90deg); }

  /* Accordion via grid-template-rows, so it animates to natural height
     without anyone measuring a pixel. */
  .bd-tile__detail {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--mk-dur-slow) var(--mk-ease);
  }
  .bd-tile[data-open] .bd-tile__detail { grid-template-rows: 1fr; }
  .bd-tile__detail > div { overflow: hidden; }
  .bd-tile__detail p {
    padding: var(--mk-4) var(--mk-4) var(--mk-3);
    border-top: 1px solid var(--mk-line);
    color: var(--mk-text-muted); font-size: var(--mk-text-sm);
  }
  .bd-classes { display: flex; flex-wrap: wrap; gap: var(--mk-1); padding: 0 var(--mk-4) var(--mk-4); }
  .bd-class {
    padding: 2px 7px; border-radius: var(--mk-radius-sm);
    background: var(--mk-surface-sunk); border: 1px solid var(--mk-line);
    font-family: var(--mk-font-mono); font-size: 10px; letter-spacing: 0;
    text-transform: none; color: var(--mk-text-muted);
  }

  .bd-empty { padding: var(--mk-16) 0; text-align: center; }

  @media (max-width: 720px) {
    .bd-grid { grid-template-columns: minmax(0, 1fr); }
    .bd-top { height: auto; padding-block: var(--mk-3); flex-wrap: wrap; }
    .bd-search { max-width: none; order: 3; width: 100%; }
  }
</style>
</head>
<body>

<header class="bd-top">
  <span class="bd-mark">mk<b>/</b>board</span>
  <div class="bd-search">
    <input class="mk-input" id="q" type="search" placeholder="Search the board…   /" aria-label="Search the board" autocomplete="off">
  </div>
  <span class="mk-grow"></span>
  <span class="mk-eyebrow" id="count">—</span>
</header>

<div class="bd-wrap">
  <div class="bd-grid" id="grid"></div>
  <div class="bd-empty" id="empty" hidden>
    <p class="mk-muted">Nothing on the board matches that. Worth building?</p>
  </div>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
// no-store: the registry is hand-edited constantly, and a cached copy
// silently renders yesterday's board.
const reg = await (await fetch("../registry/registry.json", { cache: "no-store" })).json();
const items = reg.items ?? [];

/* ---------------------------------------------------------------
   Behaviours. Every demo takes a root and wires only what is inside
   it, so the same specimen can be mounted more than once without any
   shared state or ids.
   --------------------------------------------------------------- */
const behaviors = {
  seg(root) {
    const ind = root.querySelector(".mk-seg__ind");
    const opts = [...root.querySelectorAll(".mk-seg__opt")];
    const move = (el) => {
      if (!el || !el.offsetWidth) return; // detached or not laid out yet
      ind.style.setProperty("--w", `${el.offsetWidth}px`);
      ind.style.setProperty("--x", `${el.offsetLeft - 3}px`);
    };
    opts.forEach((o) => o.addEventListener("click", () => {
      opts.forEach((x) => x.setAttribute("aria-selected", String(x === o)));
      move(o);
    }));
    // Widths shift when fonts land or the container resizes. Re-measure
    // on any of it rather than guessing once.
    const sync = () => move(root.querySelector('[aria-selected="true"]'));
    new ResizeObserver(sync).observe(root);
    sync();
  },

  copy(btn) {
    btn.addEventListener("click", () => {
      navigator.clipboard?.writeText("--mk-accent").catch(() => {});
      btn.dataset.copied = "";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => delete btn.dataset.copied, 1600);
    });
  },

  toast(btn) {
    const slot = btn.closest("[data-demo]").querySelector("[data-toast-slot]");
    btn.addEventListener("click", () => {
      slot.replaceChildren();
      const t = document.createElement("div");
      t.className = "mk-toast";
      t.innerHTML = `<span class="mk-dot" style="color: var(--mk-ok)"></span> Pinned to the board`;
      slot.append(t);
      setTimeout(() => {
        t.dataset.leaving = "";
        t.addEventListener("animationend", () => t.remove(), { once: true });
      }, 2200);
    });
  },

  meter(btn) {
    const fill = btn.closest("[data-demo]").querySelector("[data-meter]");
    const run = () => {
      fill.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = "72%"; }));
    };
    btn.addEventListener("click", run);
    run();
  },
};

function mount(root) {
  for (const el of root.querySelectorAll("[data-behavior]")) behaviors[el.dataset.behavior]?.(el);
}

/* --------------------------------------------------------------- */

function tile(it) {
  const el = document.createElement("article");
  el.className = "bd-tile";
  el.dataset.id = it.id;
  el.innerHTML = `
    <div class="bd-tile__view" data-demo>${it.demo ?? ""}</div>
    <button class="bd-tile__bar" aria-expanded="false">
      <span>${it.name ?? it.id}</span>
      <span class="bd-tile__kind">${it.kind ?? ""} <i>›</i></span>
    </button>
    <div class="bd-tile__detail"><div>
      <p>${it.note ?? ""}</p>
      <div class="bd-classes">${(it.css ?? []).map((c) => `<span class="bd-class">.${c}</span>`).join("")}</div>
    </div></div>`;

  const bar = el.querySelector(".bd-tile__bar");
  bar.addEventListener("click", () => {
    const open = "open" in el.dataset;
    if (open) delete el.dataset.open; else el.dataset.open = "";
    bar.setAttribute("aria-expanded", String(!open));
  });
  return el;
}

/* Search is keyword, widened by each item's aliases and a small synonym
   map. Not embeddings — see the README for what real semantic search
   would take. */
const SYNONYMS = {
  click: ["button", "press", "action"],
  loading: ["spinner", "skeleton", "shimmer", "wait"],
  animation: ["motion", "slide", "draw", "swap", "grow", "scale"],
  motion: ["slide", "draw", "swap", "grow", "travel", "scale"],
  form: ["checkbox", "switch", "toggle", "input", "selection"],
  transition: ["slide", "crossfade", "swap", "grow", "enter", "exit"],
};

// Every field optional on purpose: a half-finished entry should still
// show up rather than take the page down with it.
const hay = new Map(items.map((it) => [it.id, [
  it.id, it.name, it.kind, it.note,
  ...(it.tags ?? []), ...(it.aliases ?? []), ...(it.css ?? []),
].filter(Boolean).join(" ").toLowerCase()]));

function render() {
  const raw = $("#q").value.trim().toLowerCase();
  const terms = raw ? [raw, ...(SYNONYMS[raw] ?? [])] : [];
  const shown = items.filter((it) => !terms.length || terms.some((t) => hay.get(it.id).includes(t)));

  // Attach first, then mount — behaviours measure layout, and a detached
  // element measures as zero.
  $("#grid").replaceChildren(...shown.map(tile));
  mount($("#grid"));

  $("#empty").hidden = shown.length > 0;
  $("#count").textContent = raw ? `${shown.length} / ${items.length}` : `${items.length} on the board`;
}

$("#q").addEventListener("input", render);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); }
});

render();
</script>
</body>
</html>
