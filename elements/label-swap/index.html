<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label swap — Mikey Ku Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/core.css?v=2e3ad856">
<link rel="stylesheet" href="../../tokens/theme-mk.css?v=2e3ad856">
<link rel="stylesheet" href="../../css/base.css?v=2e3ad856">
<link rel="stylesheet" href="../../css/components.css?v=2e3ad856">
<link rel="stylesheet" href="../../css/site.css?v=2e3ad856">
</head>
<body>

<header class="pg-top">
  <a class="pg-mark" href="../../">Mikey Ku <span>Collection<b>.</b></span></a>
  <span class="mk-grow"></span>
  <div class="pg-accents" role="group" aria-label="Accent">
    <button class="pg-swatch" data-accent-pick="" style="background:#0f7d54" aria-pressed="true" aria-label="Emerald"></button>
    <button class="pg-swatch" data-accent-pick="cobalt" style="background:#2f5fe0" aria-pressed="false" aria-label="Cobalt"></button>
    <button class="pg-swatch" data-accent-pick="indigo" style="background:#5b4bd6" aria-pressed="false" aria-label="Indigo"></button>
    <button class="pg-swatch" data-accent-pick="slate" style="background:#3f5366" aria-pressed="false" aria-label="Slate"></button>
  </div>
  <span class="mk-eyebrow">motion</span>
</header>

<div class="pg-wrap">
  <a class="dt-back" href="../../"><i>&lsaquo;</i> All elements</a>

  <div class="dt-head">
    <h1>Label swap</h1>
    <p>Both labels sit in one grid cell and crossfade past each other, so the button never changes width mid-swap. That width twitch is the tell that separates a considered copy button from a thrown-together one.</p>
  </div>

  <div class="dt-hero" data-demo><button class='mk-btn mk-btn--secondary mk-copy' data-behavior='copy'><span class='mk-copy__swap'><span>Copy token</span><span>Copied</span></span></button></div>

  <div id="body"></div>
</div>

<script type="module">
import { mount, cell, wireCopy, wireAccent, measureSizes } from "../../js/demo.js";

const it = {"id":"label-swap","name":"Label swap","kind":"motion","tags":["copy","clipboard","swap","crossfade","confirm"],"aliases":["duplicate","copied","success","morph"],"note":"Both labels sit in one grid cell and crossfade past each other, so the button never changes width mid-swap. That width twitch is the tell that separates a considered copy button from a thrown-together one.","css":["mk-copy","mk-copy__swap"],"behavior":"copy","demo":"<button class='mk-btn mk-btn--secondary mk-copy' data-behavior='copy'><span class='mk-copy__swap'><span>Copy token</span><span>Copied</span></span></button>","variants":[{"label":"On primary","demo":"<button class='mk-btn mk-btn--primary mk-copy' data-behavior='copy'><span class='mk-copy__swap'><span>Copy token</span><span>Copied</span></span></button>"}],"motion":[{"label":"Out","value":"translateY(-7px) + fade · 0.25s","note":"The old label leaves upward."},{"label":"In","value":"translateY(7px) → 0 + fade · 0.25s","note":"The new one arrives from below, in the accent."},{"label":"Reset","value":"after 1.6s","note":"Long enough to register, short enough that you can copy twice."}],"uses":[{"label":"Beside a token","note":"Small size so it sits inside a code row without dominating it.","demo":"<div class='mk-sm mk-row mk-gap-3'><code class='mk-mono' style='font-size:var(--mk-text-sm)'>--accent</code><button class='mk-btn mk-btn--ghost mk-copy' data-behavior='copy'><span class='mk-copy__swap'><span>Copy</span><span>Copied</span></span></button></div>"}]};
const out = [];
const section = (title, html) =>
  out.push(`<div class="pg-sec"><div class="pg-label"><span class="mk-eyebrow">${title}</span></div>${html}</div>`);

if (it.variants?.length) {
  section("Variants", `<div class="el-row">${it.variants.map((v) => cell(v.label, v.demo)).join("")}</div>`);
}

/* The size classes cascade, so wrapping the demo is all it takes — nothing
   per-element, and every control inside follows. The measured height is
   filled in at runtime rather than restated here, so if a token changes the
   page reports it instead of lying. */
if (it.sizes) {
  const one = it.sizeDemo ?? it.demo;
  section("Sizes", `<div class="el-row">${["sm", "md", "lg"]
    .map((s) => cell(`.mk-${s}`, `<div class="mk-${s}">${one}</div>`, ` <em data-measure>·</em>`))
    .join("")}</div>`);
}

if (it.uses?.length) {
  section("In use", `<div class="el-row el-row--wide">${it.uses.map((u) => `
    <div class="el-cell">
      <div class="el-cell__view" data-demo>${u.demo}</div>
      <div class="el-cell__tag"><span>${u.label}</span></div>
      ${u.note ? `<div class="el-cell__note" style="padding-bottom:var(--mk-3)">${u.note}</div>` : ""}
    </div>`).join("")}</div>`);
}

if (it.motion?.length) {
  section("Motion", `<div class="dt-motion">${it.motion.map((m) => `
    <div><strong>${m.label}</strong><code>${m.value}</code><span>${m.note ?? ""}</span></div>`).join("")}</div>`);
}

section("Classes", `<div class="el-classes">${(it.css ?? []).map((c) => `<span class="el-class">.${c}</span>`).join("")}</div>`);

const body = document.querySelector("#body");
body.innerHTML = out.join("");

// Attach first, then mount — behaviours measure layout, and a detached
// element measures as zero.
mount(document.body);
measureSizes(body);
wireCopy();
wireAccent();
document.addEventListener("mk:accent", () => measureSizes(body));
</script>
</body>
</html>
