<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popover — Mikey Ku Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/core.css?v=d34045f8">
<link rel="stylesheet" href="../../tokens/theme-mk.css?v=d34045f8">
<link rel="stylesheet" href="../../css/base.css?v=d34045f8">
<link rel="stylesheet" href="../../css/components.css?v=d34045f8">
<link rel="stylesheet" href="../../css/site.css?v=d34045f8">
</head>
<body>

<header class="pg-top">
  <a class="pg-mark" href="../../">Mikey Ku <span>Collection<b>.</b></span></a>
  <span class="mk-grow"></span>
  <div class="pg-accents" role="group" aria-label="Accent">
    <button class="pg-swatch" data-accent-pick="" style="background:#0f7d54" aria-pressed="true" aria-label="Emerald"></button>
    <button class="pg-swatch" data-accent-pick="cobalt" style="background:#2f5fe0" aria-pressed="false" aria-label="Cobalt"></button>
    <button class="pg-swatch" data-accent-pick="indigo" style="background:#5b4bd6" aria-pressed="false" aria-label="Indigo"></button>
    <button class="pg-swatch" data-accent-pick="slate" style="background:#3f5366" aria-pressed="false" aria-label="Slate"></button>
  </div>
  <span class="mk-eyebrow">motion</span>
</header>

<div class="pg-shell pg-shell--rail">
  <nav class="pg-nav" id="nav" aria-label="Elements"></nav>

  <main>
    <a class="dt-back" href="../../"><i>&lsaquo;</i> All elements</a>

    <div class="dt-head">
      <span class="mk-eyebrow">Overlays</span>
      <h1>Popover</h1>
      <p>Anchored to its trigger rather than centred on the screen. Dismissal is the part people skip: it closes on Escape and on any click outside itself, not just on the trigger.</p>
    </div>

    <div class="dt-hero" data-demo><div class='mk-pop-wrap'><button class='mk-btn mk-btn--secondary' data-behavior='pop' aria-expanded='false'>Options</button><div class='mk-pop'><button class='mk-pop__item'>Duplicate</button><button class='mk-pop__item'>Rename</button><button class='mk-pop__item'>Archive</button></div></div></div>

    <div id="body"></div>
  </main>

  <aside class="pg-anchors" id="anchors"></aside>
</div>

<script type="module">
import { mount, cell, wireCopy, wireAccent, measureSizes, sidebar, pageNav } from "../../js/demo.js";

const it = {"id":"popover","name":"Popover","kind":"motion","group":"Overlays","tags":["popover","menu","dropdown","anchored","dismiss"],"aliases":["context menu","options","more","actions"],"note":"Anchored to its trigger rather than centred on the screen. Dismissal is the part people skip: it closes on Escape and on any click outside itself, not just on the trigger.","css":["mk-pop-wrap","mk-pop","mk-pop__item"],"behavior":"pop","demo":"<div class='mk-pop-wrap'><button class='mk-btn mk-btn--secondary' data-behavior='pop' aria-expanded='false'>Options</button><div class='mk-pop'><button class='mk-pop__item'>Duplicate</button><button class='mk-pop__item'>Rename</button><button class='mk-pop__item'>Archive</button></div></div>","motion":[{"label":"Enter","value":"translateY(-4px) → 0 + fade · 0.25s","note":"Drops from the trigger, so the two read as connected."},{"label":"Dismiss","value":"Escape, or a click outside","note":"Both, always. A menu that only closes on its own button is a trap."}]};
const out = [];
const section = (title, html) =>
  out.push(`<div class="pg-sec" data-section="${title.toLowerCase().replace(/\W+/g, "-")}" data-title="${title}">` +
    `<div class="pg-label"><span class="mk-eyebrow">${title}</span></div>${html}</div>`);

if (it.variants?.length) {
  section("Variants", `<div class="el-row">${it.variants.map((v) => cell(v.label, v.demo)).join("")}</div>`);
}

/* The size classes cascade, so wrapping the demo is all it takes — nothing
   per-element, and every control inside follows. The measured height is
   filled in at runtime rather than restated here, so if a token changes the
   page reports it instead of lying. */
if (it.sizes) {
  const one = it.sizeDemo ?? it.demo;
  section("Sizes", `<div class="el-row">${["sm", "md", "lg"]
    .map((s) => cell(`.mk-${s}`, `<div class="mk-${s}">${one}</div>`, ` <em data-measure>·</em>`))
    .join("")}</div>`);
}

if (it.uses?.length) {
  section("In use", `<div class="el-row el-row--wide">${it.uses.map((u) => `
    <div class="el-cell">
      <div class="el-cell__view" data-demo>${u.demo}</div>
      <div class="el-cell__tag"><span>${u.label}</span></div>
      ${u.note ? `<div class="el-cell__note" style="padding-bottom:var(--mk-3)">${u.note}</div>` : ""}
    </div>`).join("")}</div>`);
}

if (it.motion?.length) {
  section("Motion", `<div class="dt-motion">${it.motion.map((m) => `
    <div><strong>${m.label}</strong><code>${m.value}</code><span>${m.note ?? ""}</span></div>`).join("")}</div>`);
}

section("Classes", `<div class="el-classes">${(it.css ?? []).map((c) => `<span class="el-class">.${c}</span>`).join("")}</div>`);

const body = document.querySelector("#body");
body.innerHTML = out.join("");

// Attach first, then mount — behaviours measure layout, and a detached
// element measures as zero.
mount(document.body);
measureSizes(body);
pageNav(body, document.querySelector("#anchors"));
wireCopy();
wireAccent();
document.addEventListener("mk:accent", () => measureSizes(body));

// The rail is built from the same registry the index uses, so adding an
// element puts it in every page's navigation without a second list.
const reg = await (await fetch("../../registry/registry.json", { cache: "no-store" })).json();
document.querySelector("#nav").innerHTML = sidebar(reg, it.id, "../../");
</script>
</body>
</html>
